<!DOCTYPE html>
<html>
<head>
    <title>Health Monitoring System</title>
    <link rel="shortcut icon" href="LOGO.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>HEALTH MONITORING SYSTEM</h2>

    <div class="box">

        <h3>Add Student</h3>

        <label>Surname:</label>
        <input type="text" id="surname">

        <label>First Name:</label>
        <input type="text" id="firstName">

        <label>Middle Initial:</label>
        <input type="text" id="MI">

        <label>Temperature:</label>
        <input type="number" id="temperature">

        <label>Select Sickness (Multiple)</label>
        <div class="checkbox-group">
            <label><input type="checkbox" class="sickOption" value="Fever"> Fever</label>
            <label><input type="checkbox" class="sickOption" value="Cough"> Cough</label>
            <label><input type="checkbox" class="sickOption" value="Headache"> Headache</label>
            <label><input type="checkbox" class="sickOption" value="Stomach Ache"> Stomach Ache</label>
        </div>

        <label>Or manually enter sickness:</label>
        <input type="text" id="manualSickness" placeholder="ex: Sore Throat">

        <button onclick="addStudent()">Add Student</button>

    </div>
    
    <div>
        <h3>Student Health List</h3>
    </div>
    
    <!-- added Style to the Student Health list-h3 -->
    <style>
        h3 {
            text-align: justify;
            margin-left: 145px;
        }
    </style>
    
    <table>
        <thead>
            <tr>
                <th>Surname</th>
                <th>First Name</th>
                <th>Middle Initial</th>
                <th>Temperature</th>
                <th>Sickness</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>
    
    <script src="script.js"></script>
</body>
</html>
